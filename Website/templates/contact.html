
{% extends "base.html" %}
{% block title %} Contact | Shaurya Guitar Academy {% endblock %}
{% block content %}
    <div class="main-container"> 
        <h1 id="sign_in">Messages</h1>
        <div id="login">
            <form action="{{ url_for('message_post') }}" method="post"> 
                <label for="Name">Name:</label><br> 
                <input type="text" id="Name" name="Name" required><br> 
                <label for="Message">Message:</label><br> 
                <input type="text" id="Message" name="Message" required><br>
                <input type="submit" value="submit">
            </form> 
        </div>
        <div id="message-container">
            {% for review in messages %} 
                <div class="message">
                    <h2 class="message_name">{{ review.name }}</h2>
                    <hr>
                    <p>{{ review.message }}</p>
                    <p class="time_posted">{{ review.posted_at }}</p>
                </div>
            {% endfor %}
        </div>
    </div> 
{% endblock %}
